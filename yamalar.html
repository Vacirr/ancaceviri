<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AncaÇeviri | Türkçe Yamalar</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="data.js"></script>
    <style>
        :root { --neon: #ff0055; --glow: rgba(255,0,85,0.4); --bg: #0a0a0a; --card-bg: #141414; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: white; font-family: 'Montserrat', sans-serif; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; background: rgba(10,10,10,0.95); border-bottom: 1px solid rgba(255,0,85,0.2); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .logo-container { display: flex; align-items: center; gap: 15px; }
        h1 { font-size: 1.8em; font-weight: 800; text-shadow: 0 0 10px var(--glow); }
        nav { display: flex; gap: 25px; }
        nav a { color: white; text-decoration: none; font-weight: 600; font-size: 1.1em; transition: 0.3s; }
        nav a:hover, nav a.active { color: var(--neon); }

        /* Filtre + arama */
        .controls { max-width: 900px; margin: 40px auto 0; padding: 0 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        #searchInput { flex: 1; min-width: 200px; padding: 13px 22px; border-radius: 30px; border: 1px solid #333; background: var(--card-bg); color: white; font-size: 0.95em; font-family: 'Montserrat', sans-serif; outline: none; transition: 0.3s; }
        #searchInput:focus { border-color: var(--neon); box-shadow: 0 0 12px var(--glow); }
        .filter-btn { padding: 10px 18px; border-radius: 20px; border: 1px solid #333; background: var(--card-bg); color: #888; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 0.78em; cursor: pointer; transition: 0.2s; }
        .filter-btn:hover, .filter-btn.active { border-color: var(--neon); color: var(--neon); background: rgba(255,0,85,0.08); }

        /* Kartlar */
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 28px; max-width: 1200px; margin: 32px auto 60px; padding: 0 20px; }
        .card { background: var(--card-bg); border: 1px solid #222; width: 320px; border-radius: 12px; cursor: pointer; transition: 0.3s; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-8px); border-color: var(--neon); box-shadow: 0 15px 30px var(--glow); }
        .card-img { height: 180px; background-color: #222; background-size: cover; background-position: center; border-bottom: 2px solid var(--neon); }
        .card-body { padding: 18px; flex-grow: 1; display: flex; flex-direction: column; gap: 7px; }
        .card-body h3 { font-size: 1em; }
        .download-badge { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.85); color: var(--neon); padding: 4px 10px; border-radius: 8px; font-weight: 700; font-size: 0.78em; border: 1px solid var(--neon); backdrop-filter: blur(5px); }
        .status-badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 0.72em; font-weight: 700; }
        .status-done     { background: rgba(0,204,102,0.12); border: 1px solid #00cc66; color: #00cc66; }
        .status-ongoing  { background: rgba(255,0,85,0.10); border: 1px solid var(--neon); color: var(--neon); }
        .status-paused   { background: rgba(255,170,0,0.10); border: 1px solid #ffaa00; color: #ffaa00; }
        .status-waiting  { background: rgba(100,100,100,0.12); border: 1px solid #555; color: #777; }
        .progress-bar { background: #222; height: 5px; border-radius: 3px; overflow: hidden; }
        .progress-fill { background: var(--neon); height: 100%; box-shadow: 0 0 8px var(--neon); }
        .pct { color: var(--neon); font-size: 0.82em; font-weight: 700; }
        .card-meta { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 8px; border-top: 1px solid #1e1e1e; font-size: 0.73em; color: #555; }
        .empty-state { text-align: center; color: #444; padding: 80px 20px; width: 100%; font-size: 1.1em; }

        footer { padding: 40px; color: #555; font-size: 0.9em; border-top: 1px solid #111; background: #050505; text-align: center; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" style="text-decoration:none;color:inherit"><div class="logo-container">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b4/Flag_of_Turkey.svg" style="width:35px;border-radius:4px;" alt="TR">
            <h1 id="siteTitle">ANCAÇEVİRİ</h1>
        </div></a>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="yamalar.html" class="active">Yamalar</a>
            <a href="ekip.html">Ekibimiz</a>
            <a href="hakkimizda.html">Hakkımızda</a>
        </nav>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="🔍  Oyun ara..." oninput="renderGames()">
        <button class="filter-btn active" data-filter="all" onclick="setFilter(this)">Tümü</button>
        <button class="filter-btn" data-filter="Devam Ediyor" onclick="setFilter(this)">Devam Ediyor</button>
        <button class="filter-btn" data-filter="Tamamlandı" onclick="setFilter(this)">Tamamlandı</button>
        <button class="filter-btn" data-filter="Durduruldu" onclick="setFilter(this)">Durduruldu</button>
        <button class="filter-btn" data-filter="Beklemede" onclick="setFilter(this)">Beklemede</button>
    </div>

    <div class="container" id="gameGrid"></div>
    <footer>© 2026 AncaÇeviri. Tüm hakları saklıdır.</footer>

    <script>
        var activeFilter = 'all';

        var statusClass = { 'Tamamlandı':'status-done','Devam Ediyor':'status-ongoing','Durduruldu':'status-paused','Beklemede':'status-waiting' };

        function setFilter(btn) {
            document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
            btn.classList.add('active');
            activeFilter = btn.dataset.filter;
            renderGames();
        }

        function renderGames() {
            var q = document.getElementById('searchInput').value.toLowerCase();
            var games = dataManager.getGames().filter(function(g) {
                var matchQ = g.title.toLowerCase().includes(q);
                var matchF = activeFilter === 'all' || (g.status || 'Devam Ediyor') === activeFilter;
                return matchQ && matchF;
            });

            if (!games.length) {
                document.getElementById('gameGrid').innerHTML = '<div class="empty-state">Aradığın oyun bulunamadı.</div>';
                return;
            }

            document.getElementById('gameGrid').innerHTML = games.map(function(g) {
                var sc = statusClass[g.status] || 'status-ongoing';
                var date = g.lastUpdate ? 'Güncelleme: ' + g.lastUpdate : '';
                return '<div class="card" onclick="location.href=\'game-' + g.id + '.html\'">'
                    + '<div class="download-badge">📥 ' + (g.downloads || 0) + '</div>'
                    + '<div class="card-img" style="background-image:url(\'' + (g.image || '') + '\')"></div>'
                    + '<div class="card-body">'
                    + '<span class="status-badge ' + sc + '">' + (g.status || 'Devam Ediyor') + '</span>'
                    + '<h3>' + g.title + '</h3>'
                    + '<div class="progress-bar"><div class="progress-fill" style="width:' + (g.completion || 0) + '%"></div></div>'
                    + '<span class="pct">%' + (g.completion || 0) + ' Tamamlandı</span>'
                    + '<div class="card-meta"><span>' + date + '</span><span>👥 ' + (g.contributors || []).length + ' kişi</span></div>'
                    + '</div></div>';
            }).join('');
        }

        window.addEventListener('load', function() {
            document.getElementById('siteTitle').textContent = dataManager.getSiteTitle();
            renderGames();
        });
    </script>
</body>
</html>
